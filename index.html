<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173359">
  <title>استمارة بيانات الموظف - شركة ويلا</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --wella-blue: #173359;
      --wella-blue-hover: #0f2440;
      --wella-bg: #fbf8f2;
      --wella-card-bg: #fff;
      --wella-text-dark: #2b2b2b;
      --wella-border: #e2ded7;
    }
    body {
      background: var(--wella-bg);
      color: var(--wella-text-dark);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 48px;
    }
    .wella-header {
      background: #fff;
      border-bottom: 1px solid var(--wella-border);
      padding: 20px 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.03);
    }
    .wella-title-text h2 {
      color: var(--wella-blue);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: .5px;
    }
    .wella-title-text h3 {
      color: #111;
      font-size: 1.05rem;
      font-weight: 800;
      margin: 4px 0 0;
    }
    .wella-logo-img { max-height: 105px; width: auto; object-fit: contain; }
    .card {
      border: 1px solid var(--wella-border);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(23,51,89,.05);
      background: var(--wella-card-bg);
      margin-top: 25px;
    }
    .card-header {
      background: var(--wella-blue);
      color: white;
      border-radius: 11px 11px 0 0 !important;
      padding: 18px 25px;
      border: 0;
    }
    .form-label { font-weight: 600; color: #333; margin-bottom: 6px; font-size: .93rem; }
    .form-control {
      border-color: #d1cbc1;
      padding: 10px 14px;
      border-radius: 8px;
      min-height: 46px;
    }
    .form-control:focus {
      border-color: var(--wella-blue);
      box-shadow: 0 0 0 .25rem rgba(23,51,89,.15);
    }
    .btn-custom {
      background: var(--wella-blue);
      color: #fff;
      font-weight: 700;
      padding: 14px 35px;
      border: 0;
      border-radius: 8px;
      transition: all .2s ease;
    }
    .btn-custom:hover { background: var(--wella-blue-hover); color: #fff; box-shadow: 0 6px 16px rgba(23,51,89,.2); }
    .btn-custom:disabled { opacity: .7; }
    .form-intro {
      background: #f5f1e8;
      border: 1px solid var(--wella-border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .document-upload-box {
      background: #fdfbf7;
      border: 1px dashed var(--wella-blue);
      border-radius: 9px;
      padding: 15px;
      height: 100%;
    }
    .status-box { min-height: 24px; }
    .upload-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(251,248,242,.96);
      text-align: center;
    }
    .upload-overlay.is-visible { display: flex; }
    .upload-panel {
      width: min(100%, 420px);
      padding: 32px 24px;
      background: #fff;
      border: 1px solid var(--wella-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(23,51,89,.12);
    }
    .upload-spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border: 5px solid #e5e9ef;
      border-top-color: var(--wella-blue);
      border-radius: 50%;
      animation: wella-spin .8s linear infinite;
    }
    @keyframes wella-spin { to { transform: rotate(360deg); } }
    @media (max-width: 575.98px) {
      .wella-header .container { gap: 12px; }
      .wella-title-text h2 { font-size: .95rem; }
      .wella-title-text h3 { font-size: .9rem; }
      .wella-logo-img { max-height: 54px; }
      .card-body { padding: 1.15rem !important; }
      .btn-custom { width: 100%; padding: 13px 16px; }
    }
  </style>
</head>
<body>
  <header class="wella-header">
    <div class="container d-flex justify-content-between align-items-center">
      
      <img src="imgs/logo.jpeg" alt="Wella Logo" class="wella-logo-img" onerror="this.style.display='none'">
      <div class="wella-title-text text-start">
        <h2>WELLA Company for General Trading</h2>
        <h3 style="text-align: center;">شركة ويلا للتجارة العامة</h3>
      </div>
   
    </div>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <section class="card">
          <div class="card-header d-flex justify-content-between align-items-center gap-2 flex-wrap">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> استمارة بيانات موظف جديد</h5>
            <span class="badge bg-white text-dark px-3 py-2 fw-semibold">شركة ويلا</span>
          </div>
          <div class="card-body p-4">
            <div class="form-intro mb-4">
              <div class="fw-bold" style="color:var(--wella-blue)">يرجى إدخال المعلومات بدقة</div>
              <div class="small text-muted">سيتم إرسال البيانات إلى الإدارة لاستكمال إجراءات التعيين.</div>
            </div>

            <form id="employeeRequestForm" novalidate>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label">الاسم الكامل <span class="text-danger">*</span></label>
                  <input type="text" id="fullName" name="fullName" class="form-control" required maxlength="120" autocomplete="name" placeholder="أدخل الاسم الكامل">
                </div>
                <div class="col-md-6">
                  <label for="nationality" class="form-label">الجنسية <span class="text-danger">*</span></label>
                  <input type="text" id="nationality" name="nationality" class="form-control" value="عراقي" required maxlength="60">
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label for="nationalId" class="form-label">رقم الهوية / البطاقة الوطنية <span class="text-danger">*</span></label>
                  <input type="text" id="nationalId" name="nationalId" class="form-control" required maxlength="40" inputmode="numeric" autocomplete="off" placeholder="أدخل رقم الهوية">
                </div>
                <div class="col-md-4">
                  <label for="address" class="form-label">العنوان <span class="text-danger">*</span></label>
                  <input type="text" id="address" name="address" class="form-control" required maxlength="180" autocomplete="street-address" placeholder="أدخل العنوان">
                </div>
                <div class="col-md-4">
                  <label for="nearestPoint" class="form-label">أقرب نقطة دالة <span class="text-danger">*</span></label>
                  <input type="text" id="nearestPoint" name="nearestPoint" class="form-control" required maxlength="180" placeholder="مثال: قرب ...">
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-3">
                  <label for="dob" class="form-label">تاريخ الميلاد <span class="text-danger">*</span></label>
                  <input type="date" id="dob" name="dob" class="form-control" required autocomplete="bday">
                </div>
                <div class="col-md-3">
                  <label for="maritalStatus" class="form-label">الحالة الاجتماعية <span class="text-danger">*</span></label>
                  <select id="maritalStatus" name="maritalStatus" class="form-control" required>
                    <option value="" selected disabled>اختر الحالة الاجتماعية</option>
                    <option value="أعزب">أعزب</option>
                    <option value="متزوج">متزوج</option>
                  </select>
                  
                </div>
                <div class="col-md-6">
                  <label for="phoneNumber" class="form-label">رقم الهاتف <span class="text-danger">*</span></label>
                  <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" required maxlength="30" inputmode="tel" autocomplete="tel" placeholder="أدخل رقم الهاتف">
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label for="university" class="form-label">الجامعة أو المعهد</label>
                  <input type="text" id="university" name="university" class="form-control" maxlength="160" placeholder="مثال: جامعة دهوك">
                </div>
                <div class="col-md-4">
                  <label for="degree" class="form-label">الشهادة</label>
                  <select id="degree" name="degree" class="form-control">
                    <option value="بدون شهادة" selected>بدون شهادة</option>
                    <option value="دبلوم">دبلوم</option>
                    <option value="بكالوريوس">بكالوريوس</option>
                    <option value="ماجستير">ماجستير</option>
                    <option value="دكتوراه">دكتوراه</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="specialization" class="form-label">الاختصاص</label>
                  <input type="text" id="specialization" name="specialization" class="form-control" maxlength="160" placeholder="مثال: إدارة أعمال">
                </div>
              </div>
              <br>
              <br />
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <div class="document-upload-box">
                    <label for="nationalityFrontImage" class="form-label">صورة الجنسية - الوجه الأمامي <span class="text-danger">*</span></label>
                    <input type="file" id="nationalityFrontImage" class="form-control" accept="image/jpeg,image/png,image/webp" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="document-upload-box">
                    <label for="nationalityBackImage" class="form-label">صورة الجنسية - الوجه الخلفي <span class="text-danger">*</span></label>
                    <input type="file" id="nationalityBackImage" class="form-control" accept="image/jpeg,image/png,image/webp" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="document-upload-box">
                    <label for="graduationCertificate" class="form-label">شهادة التخرج أو تأييد شهادة تخرج <span class="text-danger">(اذا لم تكن خريجًا، يمكنك تخطي هذا الحقل. أما إذا كنت خريجًا، فيجب إرفاق الشهادة أو التأييد.)</span></label>
                    <input type="file" id="graduationCertificate" class="form-control" accept="image/jpeg,image/png,image/webp">
                    
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="document-upload-box">
                    <label for="otherCertificates" class="form-label">شهادات أخرى (اختياري)</label>
                    <input type="file" id="otherCertificates" class="form-control" accept="image/jpeg,image/png,image/webp" multiple>
                  </div>
                </div>
                <br>
              <br />
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label for="emerg1Name" class="form-label">طوارئ 1 (الاسم وصلة القرابة) <span class="text-danger">يجب ان تكون من صلة قرابة من الدرجة الأولة</span></label>
                    <input type="text" id="emerg1Name" name="emerg1Name" class="form-control" required maxlength="120" placeholder="مثال: الأخ (نوزاد)">
                  </div>
                  <div class="col-md-6">
                    <label for="emerg1Phone" class="form-label">رقم هاتف طوارئ 1 <span class="text-danger">*</span></label>
                    <input style="text-align: right;"  type="tel" id="emerg1Phone" name="emerg1Phone" class="form-control" required maxlength="30" inputmode="tel" placeholder="أدخل رقم الهاتف">
                  </div>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label for="emerg2Name" class="form-label">طوارئ 2 (الاسم وصلة القرابة) <span class="text-danger">يجب ان تكون من صلة قرابة من الدرجة الأولة</span></label>
                    <input type="text" id="emerg2Name" name="emerg2Name" class="form-control" required maxlength="120" placeholder="مثال: الأخ (ازاد)">
                  </div>
                  <div class="col-md-6">
                    <label for="emerg2Phone" class="form-label">رقم هاتف طوارئ 2 <span class="text-danger">*</span></label>
                    <input style="text-align: right;" type="tel" id="emerg2Phone" name="emerg2Phone" class="form-control" required maxlength="30" inputmode="tel" placeholder="أدخل رقم الهاتف">
                  </div>
                </div>
              </div>

              <div class="text-center">
                <button type="submit" id="submitBtn" class="btn btn-custom btn-lg">
                  <i class="fa-solid fa-paper-plane me-2"></i> إرسال البيانات
                </button>
                <div id="formStatus" class="status-box mt-3 small" role="status" aria-live="polite"></div>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="uploadOverlay" class="upload-overlay" role="status" aria-live="polite" aria-hidden="true">
    <div class="upload-panel">
      <div class="upload-spinner" aria-hidden="true"></div>
      <h4 class="fw-bold mb-2" style="color:var(--wella-blue)">جارٍ إرسال طلبك</h4>
      <p class="mb-0 text-muted">يتم رفع الصور وحفظ البيانات. يرجى إبقاء هذه الصفحة مفتوحة.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3HRMRXP2UYrnT-UOqreZy1HHcPyH3AkU",
      authDomain: "wella-employee-intake.firebaseapp.com",
      projectId: "wella-employee-intake",
      storageBucket: "wella-employee-intake.firebasestorage.app",
      messagingSenderId: "559967213413",
      appId: "1:559967213413:web:bfc797e8bf7081a2a9338c",
      measurementId: "G-NJ0GJQXCK0"
    };

    const configReady = !Object.values(firebaseConfig).some((value) =>
      !value || value.startsWith("PASTE_") || value.includes("YOUR_PROJECT_ID")
    );
    const form = document.getElementById("employeeRequestForm");
    const submitButton = document.getElementById("submitBtn");
    const statusBox = document.getElementById("formStatus");
    const uploadOverlay = document.getElementById("uploadOverlay");
    let db = null;
    let storage = null;

    if (configReady) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        storage = getStorage(app);
      } catch (error) {
        console.error("Firebase initialization failed.", error);
      }
    } else {
      statusBox.textContent = "سيتم تفعيل الإرسال بعد إعداد اتصال Firebase.";
      statusBox.classList.add("text-muted");
    }

    const maxFileSize = 5 * 1024 * 1024;
    const allowedImageTypes = ["image/jpeg", "image/png", "image/webp"];
    const allowedCertificateTypes = allowedImageTypes;

    function arabicLabel(input) {
      const label = form.querySelector(`label[for="${input.id}"]`);
      return label ? label.textContent.replace(/\*/g, "").replace(/\s+/g, " ").trim() : input.name;
    }

    function validateForm() {
      const requiredInputs = [...form.querySelectorAll("[required]")];
      const missing = requiredInputs.filter((input) => {
        if (input.type === "file") return !input.files || input.files.length === 0;
        return !String(input.value || "").trim();
      });

      if (missing.length) {
        statusBox.textContent = missing.length === 1
          ? `يرجى تعبئة الحقل التالي: ${arabicLabel(missing[0])}`
          : `يرجى تعبئة الحقول التالية: ${missing.map(arabicLabel).join("، ")}`;
        statusBox.classList.add("text-danger", "fw-semibold");
        missing[0].focus();
        return false;
      }

      const fileInputs = [
        { id: "nationalityFrontImage", types: allowedImageTypes },
        { id: "nationalityBackImage", types: allowedImageTypes },
        { id: "graduationCertificate", types: allowedCertificateTypes },
        { id: "otherCertificates", types: allowedCertificateTypes, multiple: true }
      ];
      for (const config of fileInputs) {
        const input = document.getElementById(config.id);
        const files = [...(input.files || [])];
        if (config.multiple && files.length > 5) {
          statusBox.textContent = "يمكن إرفاق خمسة ملفات كحد أقصى في حقل شهادات أخرى.";
          statusBox.classList.add("text-danger", "fw-semibold");
          input.focus();
          return false;
        }
        for (const file of files) {
          if (file.size > maxFileSize) {
            statusBox.textContent = `الملف في حقل «${arabicLabel(input)}» يتجاوز الحد الأقصى وهو 5 ميغابايت.`;
            statusBox.classList.add("text-danger", "fw-semibold");
            input.focus();
            return false;
          }
          if (!config.types.includes(file.type)) {
            statusBox.textContent = `نوع الملف في حقل «${arabicLabel(input)}» غير مدعوم. استخدم صورة JPG أو PNG أو WEBP.`;
            statusBox.classList.add("text-danger", "fw-semibold");
            input.focus();
            return false;
          }
        }
      }
      return true;
    }

    function fileExtension(file) {
      return ({
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp"
      })[file.type];
    }

    async function uploadDocument(requestId, prefix, file, index = 0, uploadedRefs = []) {
      if (!file) return "";
      const objectName = `${prefix}_${Date.now()}_${index}.${fileExtension(file)}`;
      const objectRef = ref(storage, `employeeRequests/${requestId}/${objectName}`);
      await uploadBytes(objectRef, file, { contentType: file.type });
      uploadedRefs.push(objectRef);
      return getDownloadURL(objectRef);
    }

    function getArabicSubmissionError(error) {
      if (error?.code === "permission-denied") {
        return "رفضت قواعد Firestore الطلب. حدّث القواعد لتسمح بالحقول الجديدة، ثم أعد المحاولة.";
      }
      if (error?.code === "storage/unauthorized") {
        return "رفضت قواعد Firebase Storage رفع الصور. حدّث قواعد Storage ثم أعد المحاولة.";
      }
      if (error?.code === "storage/no-bucket" || error?.code === "storage/bucket-not-found") {
        return "مساحة Firebase Storage غير مهيأة. أنشئ مساحة التخزين في Firebase Console وتأكد من اسم الحاوية.";
      }
      if (error?.code?.startsWith("storage/")) {
        return `تعذر رفع الصور إلى Firebase Storage (${error.code}). تحقق من إعداد Storage وقواعده.`;
      }
      return "تعذر إرسال البيانات. تحقق من قواعد Firestore وStorage واتصال الإنترنت، ثم حاول مرة أخرى.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status-box mt-3 small";

      if (!validateForm()) return;
      if (!db || !storage) {
        statusBox.textContent = "الاتصال بقاعدة البيانات أو مساحة الملفات غير مهيأ. يرجى التواصل مع الإدارة.";
        statusBox.classList.add("text-danger");
        return;
      }

      const employee = {
        fullName: document.getElementById("fullName").value.trim(),
        nationality: document.getElementById("nationality").value.trim(),
        nationalId: document.getElementById("nationalId").value.trim(),
        address: document.getElementById("address").value.trim(),
        dob: document.getElementById("dob").value,
        maritalStatus: document.getElementById("maritalStatus").value,
        nearestPoint: document.getElementById("nearestPoint").value.trim(),
        phoneNumber: document.getElementById("phoneNumber").value.trim(),
        university: document.getElementById("university").value.trim(),
        degree: document.getElementById("degree").value,
        specialization: document.getElementById("specialization").value.trim(),
        emerg1Name: document.getElementById("emerg1Name").value.trim(),
        emerg1Phone: document.getElementById("emerg1Phone").value.trim(),
        emerg2Name: document.getElementById("emerg2Name").value.trim(),
        emerg2Phone: document.getElementById("emerg2Phone").value.trim()
      };

      submitButton.disabled = true;
      submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> جارٍ إرسال البيانات...';
      uploadOverlay.classList.add("is-visible");
      uploadOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      statusBox.textContent = "";
      const uploadedRefs = [];

      try {
        const requestRef = doc(collection(db, "employeeRequests"));
        const graduationFile = document.getElementById("graduationCertificate").files[0];
        const otherFiles = [...document.getElementById("otherCertificates").files];

        const uploads = await Promise.allSettled([
          uploadDocument(requestRef.id, "nationality-front", document.getElementById("nationalityFrontImage").files[0], 0, uploadedRefs),
          uploadDocument(requestRef.id, "nationality-back", document.getElementById("nationalityBackImage").files[0], 0, uploadedRefs),
          uploadDocument(requestRef.id, "graduation", graduationFile, 0, uploadedRefs),
          ...otherFiles.map((file, index) => uploadDocument(requestRef.id, "other", file, index, uploadedRefs))
        ]);

        const failedUpload = uploads.find(result => result.status === "rejected");
        if (failedUpload) throw failedUpload.reason;

        const uploadUrls = uploads.map(result => result.value);
        const frontImageUrl = uploadUrls[0];
        const backImageUrl = uploadUrls[1];
        const graduationCertificateUrl = uploadUrls[2];
        const otherCertificateUrls = uploadUrls.slice(3);

        await setDoc(requestRef, {
          schemaVersion: 1,
          status: "pending",
          submittedAt: serverTimestamp(),
          employee,
          documents: {
            nationalityFrontUrl: frontImageUrl,
            nationalityBackUrl: backImageUrl,
            graduationCertificateUrl,
            otherCertificateUrls
          }
        });

        form.reset();
        document.getElementById("nationality").value = "عراقي";
        window.location.href = "success.html";
      } catch (error) {
        console.error("Employee request submission failed.", error);
        await Promise.allSettled(uploadedRefs.map((objectRef) => deleteObject(objectRef)));
        statusBox.textContent = getArabicSubmissionError(error);
        statusBox.classList.add("text-danger");
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> إرسال البيانات';
        uploadOverlay.classList.remove("is-visible");
        uploadOverlay.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }
    });
  </script>
