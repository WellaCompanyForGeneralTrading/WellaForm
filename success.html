<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم استلام البيانات - شركة ويلا</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --wella-blue: #173359;
      --wella-bg: #fbf8f2;
      --wella-border: #e2ded7;
    }

    body {
      background: var(--wella-bg);
      color: #2b2b2b;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    .wella-header {
      background: #fff;
      border-bottom: 1px solid var(--wella-border);
      padding: 20px 0;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .03);
    }

    .wella-title-text h2 {
      color: var(--wella-blue);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
    }

    .wella-title-text h3 {
      color: #111;
      font-size: 1.05rem;
      font-weight: 800;
      margin: 4px 0 0;
    }

    .wella-logo-img {
      max-height: 75px;
      width: auto;
      object-fit: contain;
    }

    .success-card {
      background: #fff;
      border: 1px solid var(--wella-border);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(23, 51, 89, .07);
      margin-top: 60px;
      padding: 42px 24px;
      text-align: center;
    }

    .success-icon {
      color: #198754;
      font-size: 4rem;
      margin-bottom: 18px;
    }

    .btn-custom {
      background: var(--wella-blue);
      color: #fff;
      font-weight: 700;
      padding: 13px 28px;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-custom:hover {
      background: #0f2440;
      color: #fff;
    }

    @media (max-width: 575.98px) {
      .wella-title-text h2 { font-size: .95rem; }
      .wella-title-text h3 { font-size: .9rem; }
      .wella-logo-img { max-height: 54px; }
    }
  </style>
</head>

<body>
  <header class="wella-header">
    <div class="container d-flex justify-content-between align-items-center gap-3">
      <div class="wella-title-text text-start">
        <h2>WELLA Company for General Trading</h2>
        <h3>شركة ويلا للتجارة العامة</h3>
      </div>
      <img
        src="imgs/logo.jpeg"
        alt="Wella Logo"
        class="wella-logo-img"
        onerror="this.style.display='none'"
      >
    </div>
  </header>

  <main class="container">
    <section class="success-card mx-auto" style="max-width: 720px;">
      <i class="fa-solid fa-circle-check success-icon"></i>

      <h2 class="fw-bold mb-3" style="color: #173359;">
        تم استلام بياناتك بنجاح
      </h2>

      <p class="text-muted mb-4">
        ستقوم إدارة شركة ويلا بالاطلاع على بياناتك ومراجعتها.
      </p>

      <a href="index.html" class="btn btn-custom">
        <i class="fa-solid fa-arrow-right me-2"></i>
        العودة إلى الاستمارة
      </a>
    </section>
  </main>
</body>
</html>
